<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Heat Run — Port Calder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --amber:#f2b33d; --amber2:#ffcf6a; --rust:#c2501c; --ink:#f4ead6; --dim:#b3a587; --red:#ff3a2a; --blue:#3a6aff; --green:#4ad06a;
  --panel:rgba(18,14,10,.72); --edge:rgba(242,179,61,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1a140e;color:var(--ink);font-family:'Barlow Condensed',Oswald,sans-serif;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:Oswald,sans-serif;cursor:pointer}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#speedo{position:absolute;right:18px;bottom:14px;width:300px}
#tach{width:300px;height:220px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.meter{height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);margin:4px 18px 0 60px;transform:skewX(-20deg);position:relative}
.meter label{position:absolute;left:-46px;top:-4px;font:600 11px Oswald;color:var(--dim);transform:skewX(20deg);letter-spacing:1px}
.meter div{height:100%;width:50%;transition:width .1s}
#nos-fill{background:linear-gradient(90deg,#2a70ff,#8ad0ff)}
#nos-fill.on{box-shadow:0 0 12px #6ab0ff}
#sb-fill{background:linear-gradient(90deg,#c0c8d0,#ffffff)}
#sb-fill.on{box-shadow:0 0 12px #fff}

#radar{position:absolute;left:18px;bottom:16px}
#minimap{width:230px;height:230px;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
#heat{display:flex;gap:4px;margin:8px 0 0 30px;align-items:center}
#heat::before{content:'HEAT';font:600 12px Oswald;color:var(--dim);letter-spacing:2px;margin-right:6px}
#heat i{width:26px;height:10px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);transform:skewX(-20deg)}
#heat i.on{background:linear-gradient(90deg,#ff7a20,#ff3a1a);box-shadow:0 0 8px rgba(255,90,30,.7)}
#heat.pursuit i.on{animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.6)}}

#bounty-box{position:absolute;right:20px;top:16px;text-align:right;opacity:0;transition:opacity .3s;text-shadow:0 2px 4px #000}
#bounty-box.show{opacity:1}
#bounty-box label{display:block;font:500 12px Oswald;letter-spacing:2px;color:var(--dim)}
#b-bounty{font:700 34px Oswald;color:var(--amber2);line-height:1}
#b-cost{font:600 20px Oswald;color:var(--ink);line-height:1.1}
#b-extra{margin-top:6px;font:500 14px Oswald;color:var(--ink);letter-spacing:1px}
#b-extra span{color:var(--amber2)}
#ms-track{margin-top:8px;font:500 14px 'Barlow Condensed';color:var(--dim)}
#ms-track div::before{content:'○ '}
#ms-track div.ok{color:var(--green)}
#ms-track div.ok::before{content:'● '}

#pursuit{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(520px,46vw);opacity:0;transition:opacity .3s}
#pursuit.show{opacity:1}
#pm-label{text-align:center;font:700 16px Oswald;letter-spacing:4px;text-shadow:0 2px 4px #000;margin-bottom:4px}
#pursuit.danger #pm-label{color:var(--red)}
#pursuit.cooldown #pm-label{color:#7ad0ff}
.pm-bar{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);transform:skewX(-18deg);overflow:hidden}
.pm-bar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff}
#pm-evade{position:absolute;left:50%;top:0;bottom:0;background:linear-gradient(90deg,#2a8a3a,#5aff6a)}
#pm-evade.cool{background:linear-gradient(90deg,#2a6aaa,#7ad0ff)}
#pm-bust{position:absolute;right:50%;top:0;bottom:0;background:linear-gradient(270deg,#8a1a10,#ff3a2a)}
.pm-ends{display:flex;justify-content:space-between;font:600 11px Oswald;letter-spacing:2px;color:var(--dim);margin-top:3px}

#raceinfo{position:absolute;left:20px;top:16px;opacity:0;transition:opacity .3s;text-shadow:0 2px 4px #000}
#raceinfo.show{opacity:1}
.ri-type{font:600 13px Oswald;letter-spacing:3px;color:var(--amber)}
.ri-big{font:700 60px Oswald;line-height:1;color:#fff}
.ri-big span{font-size:28px;color:var(--dim)}
.ri-big.warn{color:var(--red)}
.ri-sub{font:600 16px Oswald;letter-spacing:2px;color:var(--ink)}
.ri-time{font:500 20px Oswald;color:var(--amber2)}
#countdown{position:absolute;left:50%;top:32%;transform:translate(-50%,-50%);font:700 140px Oswald;color:var(--amber2);text-shadow:0 0 30px rgba(255,150,30,.6),0 4px 8px #000}

#toasts{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{font:600 20px Oswald;letter-spacing:3px;padding:4px 18px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.6),transparent);color:var(--amber2);text-shadow:0 2px 3px #000;animation:tin .25s ease-out;transition:opacity .4s}
.toast.out{opacity:0}
@keyframes tin{from{transform:scale(1.4);opacity:0}}
#banner{position:absolute;left:0;right:0;top:40%;text-align:center;font:700 72px Oswald;letter-spacing:8px;color:#fff;text-shadow:0 0 24px rgba(255,170,40,.7),0 4px 8px #000;opacity:0;pointer-events:none}
#banner.show{animation:ban 1.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#district{position:absolute;left:50%;top:9%;transform:translateX(-50%);font:600 22px Oswald;letter-spacing:10px;color:var(--ink);opacity:0;text-shadow:0 2px 4px #000}
#district.show{animation:dist 3.5s ease-out}
@keyframes dist{0%{opacity:0;letter-spacing:20px}15%{opacity:1;letter-spacing:10px}80%{opacity:1}100%{opacity:0}}
#radio{position:absolute;left:20px;top:44%;max-width:340px;font:500 15px 'Barlow Condensed';opacity:0;transition:opacity .4s}
#radio.show{opacity:1}
#radio div{background:rgba(10,10,20,.62);border-left:3px solid var(--blue);padding:4px 10px;margin-bottom:4px;color:#dfe6ff}
#radio b{color:#ff6a5a;letter-spacing:1px;margin-right:6px;font-weight:700}
#prompt{position:absolute;left:50%;bottom:27%;transform:translateX(-50%);font:600 20px Oswald;letter-spacing:3px;padding:6px 22px;background:rgba(0,0,0,.6);border:1px solid var(--edge);opacity:0;transition:opacity .2s}
#prompt.show{opacity:1}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;z-index:10}
.screen.show{display:flex}
#title{align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(30,20,10,.2),rgba(10,6,2,.85))}
.t-wrap{text-align:center;max-width:640px;padding:20px}
.t-logo{font:700 clamp(64px,13vw,140px) Oswald;letter-spacing:6px;line-height:.9;color:var(--ink);text-shadow:0 6px 0 rgba(0,0,0,.4)}
.t-logo span{color:var(--amber);font-style:italic}
.t-sub{font:600 18px Oswald;letter-spacing:10px;color:var(--amber2);margin:6px 0 22px}
.t-story{font:500 19px 'Barlow Condensed';color:var(--ink);line-height:1.35;margin-bottom:26px;text-shadow:0 2px 3px #000}
.t-hint{margin-top:16px;color:var(--dim);font:500 14px Oswald;letter-spacing:3px}
.big{font:700 22px Oswald;letter-spacing:4px;padding:12px 34px;background:linear-gradient(180deg,#f2b33d,#c2701c);color:#1a0e04;border:0;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);transition:filter .15s}
.big:hover{filter:brightness(1.15)}
.big.disabled,button.disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}

#menu{flex-direction:column;background:linear-gradient(90deg,rgba(14,10,6,.94) 0%,rgba(14,10,6,.86) 62%,rgba(14,10,6,.35) 100%);padding:22px 32px;overflow:auto}
.m-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--edge);padding-bottom:8px}
.m-logo{font:700 42px Oswald;letter-spacing:3px;line-height:1}
.m-logo span{color:var(--amber);font-style:italic}
.m-logo small{display:block;font:600 12px Oswald;letter-spacing:8px;color:var(--dim)}
.m-stats{display:flex;gap:28px;font:600 24px Oswald}
.m-stats label{display:block;font:500 11px Oswald;letter-spacing:3px;color:var(--dim)}
.m-tabs{display:flex;gap:4px;margin:14px 0;flex-wrap:wrap}
.m-tabs button{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid rgba(255,255,255,.12);padding:8px 18px;font:600 15px Oswald;letter-spacing:2px}
.m-tabs button.on{background:var(--amber);color:#1a0e04}
.m-tabs .go{margin-left:auto;background:#2a5a2a;border-color:#4ad06a}
.m-body{flex:1;min-height:0;overflow:auto}
.m-foot{margin-top:12px;color:var(--dim);font:500 15px 'Barlow Condensed'}
.m-foot b{color:var(--ink)}
h2{font:700 30px Oswald;letter-spacing:2px}
h3{font:600 15px Oswald;letter-spacing:3px;color:var(--amber);margin:14px 0 6px;display:flex;gap:10px}
h3 span{color:var(--dim)}
.dim{color:var(--dim);margin:10px 0}
.bar{height:8px;background:rgba(255,255,255,.1)}
.bar div{height:100%;background:linear-gradient(90deg,#c2701c,#ffcf6a)}
.career{display:flex;gap:26px;max-width:1100px}
.rv-list{width:300px;flex-shrink:0}
.rv{display:flex;gap:10px;align-items:baseline;padding:5px 10px;cursor:pointer;border-left:3px solid transparent;font:500 16px Oswald}
.rv:hover{background:rgba(255,255,255,.06)}
.rv .rk{width:34px;color:var(--amber);font-weight:700}
.rv .nm{flex:1;letter-spacing:1px}
.rv .cr{font-size:12px;color:var(--dim)}
.rv .x{font-size:11px;color:var(--green);letter-spacing:1px}
.rv.current{border-left-color:var(--amber);background:rgba(242,179,61,.1)}
.rv.locked{opacity:.45}
.rv.beaten .nm{text-decoration:line-through;color:var(--dim)}
.rv-detail{flex:1;max-width:620px}
.rv-card{display:flex;gap:18px;align-items:center;padding:14px;background:linear-gradient(90deg,var(--c),transparent 70%);border-left:6px solid var(--c)}
.rv-rank{font:700 64px Oswald;line-height:1;text-shadow:0 3px 6px #000}
.rv-card h2{text-shadow:0 2px 4px #000}
.rv-name,.rv-car{font:500 16px 'Barlow Condensed';text-shadow:0 1px 3px #000}
.evs .ev{display:flex;gap:10px;align-items:center;padding:6px 8px;background:rgba(255,255,255,.04);margin-bottom:3px}
.ev .ty{width:110px;font:600 13px Oswald;letter-spacing:2px;color:var(--amber)}
.ev .en{flex:1;font:500 17px Oswald}
.ev .rw{font-size:14px;color:var(--dim)}
.ev button,.car button,.up button{background:var(--amber);border:0;padding:5px 14px;font:600 13px Oswald;letter-spacing:1px;color:#1a0e04}
.ev.won .en::after{content:' ✓';color:var(--green)}
.ms div{padding:4px 8px;font:500 16px 'Barlow Condensed'}
.ms div::before{content:'○ ';color:var(--dim)}
.ms div.done::before{content:'● ';color:var(--green)}
.ms i{color:var(--dim);font-size:13px}
.rv-detail .big{margin-top:16px}
.garage,.perf,.rap,.settings{max-width:960px}
.car{display:flex;gap:12px;align-items:center;padding:8px;background:rgba(255,255,255,.04);margin-bottom:3px}
.car.sel{outline:1px solid var(--amber)}
.car.locked{opacity:.4}
.car .sw{width:26px;height:16px;border:1px solid rgba(255,255,255,.3)}
.car b{width:200px;font:600 18px Oswald}
.car span{flex:1;color:var(--dim)}
.car em{color:var(--green);font:600 13px Oswald;letter-spacing:2px}
.perf{display:flex;gap:30px}
.perf-l{width:360px}
.st{margin:8px 0}.st label{font:500 12px Oswald;letter-spacing:2px;color:var(--dim)}
.perf-r{flex:1}
.up{display:flex;gap:12px;align-items:center;padding:8px;background:rgba(255,255,255,.04);margin-bottom:3px}
.up b{width:120px;font:600 17px Oswald}
.up span{flex:1;color:var(--dim)}
.pips{display:flex;gap:3px}.pips i{width:16px;height:8px;background:rgba(255,255,255,.12);transform:skewX(-20deg)}.pips i.on{background:var(--amber)}
.up em{color:var(--green);font:600 13px Oswald}
.paints{display:flex;flex-wrap:wrap;gap:6px}
.paints button{width:34px;height:24px;border:2px solid rgba(255,255,255,.2)}
.paints button.sel{border-color:#fff}
.rap table,.standings{border-collapse:collapse;font:500 18px Oswald}
.rap td,.standings td{padding:4px 18px 4px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rap td:last-child{color:var(--amber2)}
.rap p,.settings p{max-width:680px;line-height:1.4;font-size:17px}
.settings label{display:block;margin:8px 0;font:500 18px 'Barlow Condensed'}
.keys td{padding:2px 14px 2px 0}.keys td:first-child{color:var(--amber2);font-family:Oswald}
.danger{margin-top:18px;background:#5a1a10;color:#fff;border:1px solid #c03020;padding:8px 18px;letter-spacing:2px}

#post,#pause,#markers{align-items:center;justify-content:center;background:rgba(10,6,2,.55)}
.post-box,#pause{text-align:center}
.post-box{background:var(--panel);border:1px solid var(--edge);padding:26px 40px;min-width:420px}
.post-box h1,#pause h1,#markers h1{font:700 64px Oswald;letter-spacing:6px;line-height:1}
h1.win{color:var(--amber2)} h1.lose{color:var(--red)}
.post-box .sub{color:var(--dim);font:600 15px Oswald;letter-spacing:3px;margin:6px 0 14px}
.standings{margin:0 auto}
.standings tr.me td{color:var(--amber2)}
.reward{margin:14px 0;font:500 19px 'Barlow Condensed';max-width:520px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btns button:not(.big),#pause button{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.2);padding:10px 20px;font:600 16px Oswald;letter-spacing:2px}
#pause{flex-direction:column;gap:10px}
#pause button{min-width:280px}
#pause p{color:var(--dim);margin-top:14px}
#markers{flex-direction:column;gap:10px}
.cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.card{width:150px;height:200px;background:linear-gradient(160deg,#3a2a14,#140c04);border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-6px)}
.card .back{font:700 64px Oswald;color:var(--amber)}
.card.open{background:linear-gradient(160deg,#f2b33d,#8a4a10);color:#1a0e04;cursor:default}
.card.missed{opacity:.35}
.card .front{padding:10px;text-align:center}
.card .front b{display:block;font:700 20px Oswald;letter-spacing:1px}
.card .front span{font:500 15px 'Barlow Condensed'}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#140e08;z-index:20;font:600 20px Oswald;letter-spacing:6px;color:var(--amber)}
@media (max-width:1100px){#pursuit{width:34vw;bottom:96px}}
@media (max-width:820px){#speedo{transform:scale(.7);transform-origin:right bottom}#radar{transform:scale(.7);transform-origin:left bottom}.career{flex-direction:column}.rv-list{width:100%}.perf{flex-direction:column}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" style="display:none">
  <div id="raceinfo"></div>
  <div id="bounty-box"><label id="b-label1">BOUNTY</label><div id="b-bounty">0</div><label id="b-label2">CASH</label><div id="b-cost">$0</div>
    <div id="b-extra">UNITS <span id="b-units">0</span> · DOWN <span id="b-immob">0</span> · <span id="b-time">0:00</span></div><div id="ms-track"></div></div>
  <div id="district"></div>
  <div id="toasts"></div>
  <div id="banner"></div>
  <div id="countdown"></div>
  <div id="radio"></div>
  <div id="prompt"></div>
  <div id="pursuit"><div id="pm-label">EVADE</div><div class="pm-bar"><div id="pm-bust"></div><div id="pm-evade"></div></div><div class="pm-ends"><span>BUSTED</span><span>EVADE</span></div></div>
  <div id="radar"><canvas id="minimap" width="230" height="230"></canvas><div id="heat"><i></i><i></i><i></i><i></i><i></i></div></div>
  <div id="speedo"><canvas id="tach" width="300" height="220"></canvas>
    <div class="meter"><label>NOS</label><div id="nos-fill"></div></div>
    <div class="meter"><label>SPDBRK</label><div id="sb-fill"></div></div></div>
</div>
<div id="title" class="screen"></div>
<div id="menu" class="screen"></div>
<div id="post" class="screen"></div>
<div id="pause" class="screen"></div>
<div id="markers" class="screen"></div>
<div id="loading">LOADING PORT CALDER…</div>
