  e.userData.wingL.rotation.z = flap;
  e.userData.wingR.rotation.z = -flap;
  // The chicken hangs below the talons.
  m.position.set(ex, ey - 0.95, ez);
  m.scale.set(0.9, 0.9, 0.9);
  m.rotation.set(0, 0, Math.sin(p * 12) * 0.2);
  m.visible = true;
}

// Per-frame visuals for the current death. Holds the last pose at game over.
function deathVisual(t) {
  const dur = deathDuration(G.deathType);
  const p = clamp((t - G.deathT0) / dur, 0, 1);
  const type = G.deathType;
  if (type === 'squash') deathSquashUpdate(p);
  else if (type === 'drown') deathDrownUpdate(p);
  else if (type === 'swept') deathSweptUpdate(p);
  else if (type === 'train') deathTrainUpdate(p);
  else deathEagleUpdate(p);
  if (type !== 'eagle') DEATH.eagle.visible = false;
}

// Small easing helpers used by the death animations. No allocation.
function easeOutCubic(x) {
  const u = 1 - x;
  return 1 - u * u * u;
}

function easeInQuad(x) {
  return x * x;
}

/* =================================================================
   AUDIO MANAGER
   All sounds are synthesized with Web Audio. The context is created
   or resumed only from a user gesture. Voices are capped.
   ================================================================= */
const AUDIO = {
  ctx: null,        // AudioContext, null until the first gesture.
  master: null,     // Master gain node.
  noise: null,      // Shared one-second white-noise buffer.
  voices: 0,        // Active voices.
  muted: false,     // Mirrors G.muted.
};

// Create or resume the audio context. Safe to call on every gesture.
function audioUnlock() {
  try {
    if (!AUDIO.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = AUDIO.muted ? 0 : CONFIG.masterGain;
      master.connect(ctx.destination);
      // Noise from a small local LCG so game randomness is never touched.
      const len = ctx.sampleRate;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      let s = 12345;
      for (let i = 0; i < len; i++) {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        data[i] = s / 2147483648 - 1;
      }
      AUDIO.ctx = ctx;
      AUDIO.master = master;
      AUDIO.noise = buf;
    }
    if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
  } catch (e) {
    /* audio unavailable: the game runs silently */
  }
}

// Mute or unmute the master output.
function audioSetMuted(flag) {
  AUDIO.muted = flag;
  if (AUDIO.master) AUDIO.master.gain.value = flag ? 0 : CONFIG.masterGain;
}

// Begin one voice and register its end so the cap works.
function voiceStart(node, endAt) {
  AUDIO.voices++;
  node.onended = () => { AUDIO.voices = Math.max(0, AUDIO.voices - 1); };
  node.stop(endAt);
}

// One oscillator with a simple attack and decay envelope.
function tone(freq, freqEnd, dur, type, vol, delay) {
  const ctx = AUDIO.ctx;
  const t0 = ctx.currentTime + (delay || 0);
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (freqEnd && freqEnd !== freq) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(AUDIO.master);
  o.start(t0);
  voiceStart(o, t0 + dur + 0.02);
}

// Filtered noise burst, used for whooshes, splashes, rumbles and clicks.
function noiseBurst(dur, filterType, f0, f1, vol, delay) {
  const ctx = AUDIO.ctx;
  const t0 = ctx.currentTime + (delay || 0);
  const src = ctx.createBufferSource();
  src.buffer = AUDIO.noise;
  const filt = ctx.createBiquadFilter();
  filt.type = filterType;
  filt.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) filt.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.03, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt);
  filt.connect(g);
  g.connect(AUDIO.master);
  src.start(t0, 0, dur);
  voiceStart(src, t0 + dur + 0.02);
}

// Named sound effects. Each call is short and returns at once.
const SFX = {
  hop() { tone(560, 300, 0.07, 'sine', 0.16); },
  bump() { tone(190, 90, 0.11, 'square', 0.08); },
  coin() {
    tone(988, 988, 0.11, 'sine', 0.2);
    tone(1319, 1319, 0.16, 'sine', 0.18, 0.07);
  },
  horn() {
    tone(370, 360, 0.36, 'sawtooth', 0.05);
    tone(466, 452, 0.36, 'sawtooth', 0.04);
  },
  rumble() {
    noiseBurst(0.6, 'lowpass', 160, 90, 0.2);
    tone(58, 50, 0.6, 'sine', 0.12);
  },
  bell() {
    tone(1320, 1320, 0.5, 'sine', 0.2);
    tone(1760, 1760, 0.4, 'sine', 0.08);
    tone(1320, 1320, 0.5, 'sine', 0.2, 0.42);
    tone(1760, 1760, 0.4, 'sine', 0.08, 0.42);
  },
  whoosh() {
    noiseBurst(0.8, 'bandpass', 380, 1500, 0.22);
    tone(120, 60, 0.8, 'sine', 0.06);
  },
  splash() {
    noiseBurst(0.4, 'highpass', 900, 3000, 0.26);
    tone(420, 160, 0.3, 'sine', 0.07);
  },
  squash() {
    tone(150, 45, 0.26, 'sine', 0.2);
    noiseBurst(0.1, 'lowpass', 1200, 300, 0.2);
  },
  screech() {
    tone(1800, 900, 0.7, 'sawtooth', 0.06);
    tone(2050, 1150, 0.7, 'triangle', 0.04, 0.02);
  },
  click() { tone(1400, 1400, 0.03, 'square', 0.05); },
  fanfare() {
    const notes = [523, 659, 784, 1047];
    for (let i = 0; i < notes.length; i++) tone(notes[i], notes[i], 0.22, 'triangle', 0.16, i * 0.12);
  },
};

// Play a named sound. Silent when muted, not yet unlocked, or over the voice cap.
function audioPlay(name) {
  if (!AUDIO.ctx || AUDIO.muted || AUDIO.ctx.state !== 'running') return;
  if (AUDIO.voices >= CONFIG.maxVoices) return;
  const fn = SFX[name];
  if (fn) fn();
}

// Public audio surface used by the rest of the file.
AUDIO.play = audioPlay;
AUDIO.unlock = audioUnlock;
AUDIO.setMuted = audioSetMuted;

/* =================================================================
   PARTICLE EFFECTS
   A fixed pool of small cubes. Each particle moves analytically from
   its spawn time, so effects stay in step with the sim clock.
   ================================================================= */
const FX = {
  pool: [],          // Particle records, always attached and hidden when idle.
  next: 0,           // Ring-buffer cursor.
  group: null,       // Parent group, set in init.
  geo: null,         // Shared cube geometry.
  matDust: null,     // Dust material.
  matWater: null,    // Water-droplet material.
  matWhite: null,    // White foam material.
};

// Build the particle pool once.
function fxInit(group) {
  FX.group = group;
  FX.geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
  FX.matDust = new THREE.MeshLambertMaterial({ color: 0xe8dcc0 });
  FX.matWater = new THREE.MeshLambertMaterial({ color: 0x7fd0ff });
  FX.matWhite = new THREE.MeshLambertMaterial({ color: 0xf2fbff });
  for (let i = 0; i < 64; i++) {
    const m = new THREE.Mesh(FX.geo, FX.matDust);
    m.visible = false;
    group.add(m);
    FX.pool.push({ mesh: m, t0: -10, life: 0.1, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, s: 1, on: false });
  }
}

// Claim the next particle slot.
function fxSpawn(mat, x, y, z, vx, vy, vz, life, s) {
  const p = FX.pool[FX.next];
  FX.next = (FX.next + 1) % FX.pool.length;
  p.mesh.material = mat;
  p.x = x; p.y = y; p.z = z;
  p.vx = vx; p.vy = vy; p.vz = vz;
  p.life = life; p.s = s;
  p.t0 = G.simTime;
  p.on = true;
}

// Dust puff for a landing or a squash.
FX.dust = function (row, x, t) {
  for (let i = 0; i < 6; i++) {
    const a = i * (TAU / 6);
    fxSpawn(FX.matDust, x, 0.08, row, Math.cos(a) * 1.1, 0.9, Math.sin(a) * 1.1, 0.35, 1.1);
  }
};

// Ripple droplets for a landing on a log or a lily pad.
FX.ripple = function (row, x, t) {
  for (let i = 0; i < 4; i++) {
    const a = i * (TAU / 4) + 0.4;
    fxSpawn(FX.matWhite, x, 0.12, row, Math.cos(a) * 0.7, 0.5, Math.sin(a) * 0.7, 0.4, 0.8);
  }
};

// Splash burst for drowning.
FX.splash = function (row, x, t) {
  for (let i = 0; i < 18; i++) {
    const a = i * (TAU / 18);
    const sp = 1.2 + (i % 3) * 0.5;
    fxSpawn(i % 2 ? FX.matWater : FX.matWhite, x, 0.1, row, Math.cos(a) * sp, 2.2 + (i % 4) * 0.4, Math.sin(a) * sp, 0.6, 1.2);
  }
};

// Position every live particle for render time t. Frees expired ones.
function fxUpdate(t) {
  for (const p of FX.pool) {
    if (!p.on) continue;
    const tau = t - p.t0;
    if (tau >= p.life) {
      p.on = false;
      p.mesh.visible = false;
      continue;
    }
    const a = tau / p.life;
    p.mesh.visible = true;
    p.mesh.position.set(p.x + p.vx * tau, Math.max(0.02, p.y + p.vy * tau - 6 * tau * tau), p.z + p.vz * tau);
    const sc = p.s * (1 - a * 0.7);
    p.mesh.scale.set(sc, sc, sc);
  }
}

// Clear all live particles (used by restart).
function fxReset() {
  for (const p of FX.pool) {
    p.on = false;
    p.mesh.visible = false;
  }
}

/* =================================================================
   COINS
   Collected coins are remembered per run. Each pickup chimes, adds to
   the run total, and adds to the persisted total.
   ================================================================= */
function collectCoin(row, slot) {
  const key = coinKey(row, slot);
  if (RUN_COINS.has(key)) return;
  RUN_COINS.add(key);
  G.runCoins++;
  G.coins++;
  storeSet(CONFIG.keyCoins, G.coins);
  AUDIO.play('coin');
  UI.refresh();
}

/* =================================================================
   UI / HUD MANAGER
   DOM is written only when a value changes, so the frame loop never
   touches layout for unchanged numbers.
   ================================================================= */
const UI = {
  els: null,          // Cached DOM elements, set in init.
  lastScore: -1,      // Last score written to the DOM.
  lastTop: -1,        // Last top score written to the DOM.
  lastCoins: -1,      // Last coin count written to the DOM.
  lastMute: null,     // Last mute label state written to the DOM.
  screen: 'title',    // Which overlay is showing.

  // Look up and cache every element the UI touches.
  init() {
    const $ = (id) => document.getElementById(id);
    UI.els = {
      score: $('score'), top: $('top'), coins: $('coins'), mute: $('mute-btn'),
      title: $('screen-title'), over: $('screen-over'), pause: $('screen-pause'),
      overScore: $('over-score'), overTop: $('over-top'), overNew: $('over-new'),
    };
  },

  // Show one overlay and hide the others. 'none' hides all.
  show(screen) {
    const e = UI.els;
    UI.screen = screen;
    e.title.classList.toggle('hidden', screen !== 'title');
    e.over.classList.toggle('hidden', screen !== 'over');
    e.pause.classList.toggle('hidden', screen !== 'paused');
  },

  // Fill the game-over texts from the finished run.
  fillOver() {
    const e = UI.els;
    e.overScore.textContent = 'Score ' + G.score;
    e.overTop.textContent = 'Top ' + G.topScore;
    e.overNew.classList.toggle('hidden', !G.newTop);
  },

  // Write any changed numbers into the HUD. Cheap when nothing changed.
  refresh() {
    const e = UI.els;
    if (!e) return;
    const top = Math.max(G.topScore, G.score);
    if (G.score !== UI.lastScore) {
      e.score.textContent = String(G.score);
      UI.lastScore = G.score;
    }
    if (top !== UI.lastTop) {
      e.top.textContent = 'TOP ' + top;
      UI.lastTop = top;
    }
    if (G.coins !== UI.lastCoins) {
      e.coins.textContent = String(G.coins);
      UI.lastCoins = G.coins;
    }
    UI.setMutedLabel();
  },

  // Keep the mute button text in line with the mute flag.
  setMutedLabel() {
    const e = UI.els;
    if (!e) return;
    if (UI.lastMute !== G.muted) {
      e.mute.textContent = G.muted ? 'SOUND OFF' : 'SOUND ON';
      e.mute.setAttribute('aria-pressed', G.muted ? 'true' : 'false');
      UI.lastMute = G.muted;
    }
  },
};

/* =================================================================
   INPUT HANDLING
   Keyboard, mouse, and touch all end in handleDirection() or one of
   the action helpers below. The test API uses the same functions.
   ================================================================= */

// Keys mapped to a tile move.
const KEY_DIR = {
  ArrowUp: 'up', KeyW: 'up',
  ArrowDown: 'down', KeyS: 'down',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
};

// Start a run from the title screen. No-op in any other mode.
function startRun() {
  if (G.mode !== 'title') return;
  G.mode = 'playing';
  G.idleTime = 0;
  UI.show('none');
}

// Route a direction through the same path as keyboard input.
function handleDirection(dirName) {
  if (G.mode === 'title') {
    startRun();
    playerInput(dirName);
    return;
  }
  if (G.mode === 'playing') {
    playerInput(dirName);
  }
  // Dying, paused, and game over ignore movement.
}

// Pause on focus loss or on P / Escape. Only a live run can pause.
function pauseIfRunning() {
  if (G.mode === 'playing' || G.mode === 'dying') {
    G.pausedFrom = G.mode;
    G.mode = 'paused';
    UI.show('paused');
  }
}

// Toggle pause: resume into the previous mode, or pause a live run.
function togglePause() {
  if (G.mode === 'paused') {
    G.mode = G.pausedFrom;
    UI.show('none');
  } else {
    pauseIfRunning();
  }
}

// Mute toggle, persisted. The unmute click confirms the change.
function toggleMute() {
  G.muted = !G.muted;
  storeSet(CONFIG.keyMuted, G.muted ? '1' : '0');
  AUDIO.setMuted(G.muted);
  UI.setMutedLabel();
  if (!G.muted) AUDIO.play('click');
}

// Restart from the game-over screen (Space, Enter, tap, or the button).
function restartFromOver() {
  if (G.mode !== 'gameover') return;
  gameRestart();
}

// Keyboard handler on the window.
function onKeyDown(e) {
  AUDIO.unlock();
  if (e.code === 'KeyM') {
    toggleMute();
    return;
  }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (G.mode === 'title') return;
    togglePause();
    e.preventDefault();
    return;
  }
  if (e.repeat) {
    e.preventDefault();
    return;
  }
  const dirName = KEY_DIR[e.code];
  if (dirName !== undefined) {
    e.preventDefault();
    if (G.mode === 'paused') return;
    handleDirection(dirName);
    return;
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (G.mode === 'title') startRun();
    else if (G.mode === 'gameover') restartFromOver();
    return;
  }
  if (G.mode === 'title') startRun();
}

// Swipe and tap tracking for pointer input.
const POINTER = { id: -1, x0: 0, y0: 0, active: false };

// Pointer down: remember where the touch or click began.
function onPointerDown(e) {
  AUDIO.unlock();
  if (e.target.closest && e.target.closest('#hud-tr')) return;
  if (G.mode === 'paused') {
    togglePause();
    return;
  }
  if (G.mode === 'gameover') {
    restartFromOver();
    return;
  }
  POINTER.id = e.pointerId;
  POINTER.x0 = e.clientX;
  POINTER.y0 = e.clientY;
  POINTER.active = true;
  if (G.mode === 'title') startRun();
}

// Pointer up: a short tap hops forward, a clear swipe hops that way.
function onPointerUp(e) {
  if (!POINTER.active || e.pointerId !== POINTER.id) return;
  POINTER.active = false;
  if (G.mode !== 'playing' && G.mode !== 'title') return;
  const dx = e.clientX - POINTER.x0;
  const dy = e.clientY - POINTER.y0;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  let dirName = 'up';
  if (Math.max(ax, ay) > 24) {
    if (ax > ay) dirName = dx > 0 ? 'right' : 'left';
    else dirName = dy > 0 ? 'down' : 'up';
  }
  handleDirection(dirName);
}

// Visibility and focus: pause when the tab is hidden or loses focus.
function onVisibility() {
  if (document.hidden) pauseIfRunning();
}

function onBlur() {
  pauseIfRunning();
}

// Wire every input listener once at startup.
function wireInput() {
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', () => { POINTER.active = false; });
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('blur', onBlur);
  const again = document.getElementById('again-btn');
  if (again) again.addEventListener('click', (e) => { e.stopPropagation(); restartFromOver(); });
  const mute = UI.els.mute;
  mute.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    AUDIO.unlock();
    toggleMute();
  });
  mute.addEventListener('click', (e) => e.stopPropagation());
}

/* =================================================================
   SCENE, WINDOW, SIMULATION STEP, RENDER, AND MAIN LOOP
   The sim runs in fixed DT steps from an accumulator. Render runs once
   per animation frame with the latest state and never changes the sim.
   ================================================================= */
let renderer = null;        // WebGLRenderer, set in initScene.
let scene = null;           // THREE.Scene, set in initScene.
let worldGroup = null;      // Parent of every live lane group.
let dirLight = null;        // Shadow-casting directional light.
let lightTarget = null;     // Target of the directional light (kept in the scene).
const LANES = new Map();    // Row number to live Lane object.
const WIN = { lo: 0, hi: -1 }; // Current built window of rows.
let lastHonkT = -10;        // Sim time of the last car horn or truck rumble.

/* -----------------------------------------------------------------
   Scene setup. Runs once. Creates lights, the renderer, the groups,
   the chicken, the eagle, and the particle pool.
   ----------------------------------------------------------------- */
function initScene() {
  const canvas = document.getElementById('gl');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.pixelRatioMax));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd3f7);   // Sky colour.

  CAM.camera = new THREE.OrthographicCamera(-CAM.halfW, CAM.halfW, CAM.halfH, -CAM.halfH, 0.1, 300);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x3c4a5c, 0.85);  // Soft sky fill.
  scene.add(hemi);
  dirLight = new THREE.DirectionalLight(0xfff4e0, 1.05);            // Soft light from above.
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(CONFIG.shadowMapSize, CONFIG.shadowMapSize);
  dirLight.shadow.camera.near = 1;
  dirLight.shadow.camera.far = 80;
  lightTarget = new THREE.Object3D();
  dirLight.target = lightTarget;
  scene.add(dirLight);
  scene.add(lightTarget);

  worldGroup = new THREE.Group();
  scene.add(worldGroup);

  const fxGroup = new THREE.Group();
  scene.add(fxGroup);
  fxInit(fxGroup);

  PLAYER.mesh = MODELS.chicken;
  scene.add(PLAYER.mesh);
  DEATH.eagle = MODELS.eagle;
  DEATH.eagle.visible = false;
  scene.add(DEATH.eagle);
}

// Fit the camera and the shadow frustum to the canvas. Called on resize.
function resizeAll() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  cameraFit(w, h);
  const s = Math.max(CAM.halfW, CAM.extZ) + 4;
  const sc = dirLight.shadow.camera;
  sc.left = -s;
  sc.right = s;
  sc.top = s;
  sc.bottom = -s;
  sc.updateProjectionMatrix();
}

/* -----------------------------------------------------------------
   Lane window. Lanes are built for a band of rows around the camera and
   released when they fall outside it. Pooled lanes are reused.
   ----------------------------------------------------------------- */

// Build the lane object for row r and attach it to the world.
function buildLane(r) {
  let lane;
  if (r < 0) {
    lane = takeLane('wall');
    lane.setup(r, null);
  } else {
    const d = rowDesc(r);
    lane = takeLane(d.type);
    lane.setup(r, d);
    if (d.type === 'rail') initRailCursors(lane);
  }
  LANES.set(r, lane);
  worldGroup.add(lane.group);
}

// Release the lane for row r back to its pool.
function releaseLane(r) {
  const lane = LANES.get(r);
  if (!lane) return;
  worldGroup.remove(lane.group);
  lane.teardown();
  giveLane(lane);
  LANES.delete(r);
}

// Start a track's warning and whoosh cursors at the first train still ahead.
function initRailCursors(lane) {
  const trains = lane.L.trains;
  lane.warnIdx = 0;
  lane.passIdx = 0;
  while (lane.warnIdx < trains.length && trains[lane.warnIdx].t - CONFIG.trainWarning <= G.simTime) lane.warnIdx++;
  while (lane.passIdx < trains.length && trains[lane.passIdx].t <= G.simTime) lane.passIdx++;
}

// Keep the built window centred on the camera. Only rebuilds when the window moves.
function syncWindow() {
  const cz = Math.floor(CAM.z);
  const lo = cz - CONFIG.windowBehind;
  const hi = cz + CONFIG.windowAhead;
  if (lo === WIN.lo && hi === WIN.hi && LANES.size > 0) return;
  for (const r of Array.from(LANES.keys())) {
    if (r < lo || r > hi) releaseLane(r);
  }
  for (let r = lo; r <= hi; r++) {
    if (!LANES.has(r)) buildLane(r);
  }
  WIN.lo = lo;
  WIN.hi = hi;
}

/* -----------------------------------------------------------------
   Sound cues that come from hazards in the window. Deterministic, so
   they never touch the world PRNG.
   ----------------------------------------------------------------- */
function railCues(t) {
  for (const lane of LANES.values()) {
    if (lane.type !== 'rail' || lane.L === null) continue;
    const trains = lane.L.trains;
    while (lane.warnIdx < trains.length && trains[lane.warnIdx].t - CONFIG.trainWarning <= t) {
      AUDIO.play('bell');
      lane.warnIdx++;
    }
    while (lane.passIdx < trains.length && trains[lane.passIdx].t <= t) {
      AUDIO.play('whoosh');
      lane.passIdx++;
    }
  }
}

// A car horn, or a truck rumble, when a vehicle passes right beside the player.
function honkCheck(t) {
  if (t - lastHonkT < 2) return;
  for (let r = PLAYER.row - 1; r <= PLAYER.row + 1; r++) {
    const lane = LANES.get(r);
    if (!lane || lane.type !== 'road' || lane.L === null) continue;
    const L = lane.L;
    for (const v of L.vehicles) {
      const centre = vehicleLeft(L, v, t) + v.len / 2;
      if (Math.abs(centre - PLAYER.x) < 1.0) {
        AUDIO.play(v.len >= 2 ? 'rumble' : 'horn');
        lastHonkT = t;
        return;
      }
    }
  }
}

/* -----------------------------------------------------------------
   Simulation step. Runs at exactly DT seconds of sim time per call.
   Order: clock, window, camera, player, hazard checks, eagle, audio,
   death clock.
   ----------------------------------------------------------------- */
function simStep() {
  if (G.mode === 'paused' || G.mode === 'gameover') return;
  G.simTime += DT;
  const t = G.simTime;
  if (G.mode === 'playing') G.idleTime += DT;
  syncWindow();
  // The camera holds still on the title screen so the first hop starts in view.
  if (G.mode === 'playing' || G.mode === 'dying') cameraStep(DT);
  if (G.mode === 'playing' || G.mode === 'dying') railCues(t);
  if (G.mode === 'playing') {
    playerStep(t);
  }
  if (G.mode === 'playing') {
    if (G.idleTime > CONFIG.idleEagleSeconds) {
      killPlayer('eagle');
    } else if (playerBelowScreen()) {
      killPlayer('eagle');
    }
  }
  if (G.mode === 'playing' && !PLAYER.hop.on && !PLAYER.riding) honkCheck(t);
  if (G.mode === 'dying') deathStep(t);
}

// Advance the fixed-step sim by a number of real or test seconds.
function advance(seconds) {
  if (G.mode === 'paused' || G.mode === 'gameover') {
    G.accum = 0;
    return;
  }
  G.accum += seconds;
  while (G.accum >= DT - 1e-9) {
    simStep();
    G.accum -= DT;
    if (G.mode === 'paused' || G.mode === 'gameover') {
      G.accum = 0;
      break;
    }
  }
}

/* -----------------------------------------------------------------
   World reset and run control. A reset rebuilds all per-run state from
   the seed. Pooled objects are reused, never disposed.
   ----------------------------------------------------------------- */

// Start a fresh world with the given seed in the given mode.
function worldReset(seedValue, mode) {
  seedRng(seedValue);
  G.runSeed = seedValue;
  for (const r of Array.from(LANES.keys())) releaseLane(r);
  WIN.lo = 0;
  WIN.hi = -1;
  resetGen();
  RUN_COINS.clear();
  G.mode = mode;
  G.simTime = 0;
  G.accum = 0;
  G.score = 0;
  G.maxRow = 0;
  G.idleTime = 0;
  G.deathType = null;
  G.newTop = false;
  G.runCoins = 0;
  G.pausedFrom = 'playing';
  lastHonkT = -10;
  playerReset();
  // Clear any death-visual pose (scale, height, tumble) left by the previous run.
  PLAYER.mesh.visible = true;
  PLAYER.mesh.scale.set(1, 1, 1);
  PLAYER.mesh.position.set(0, 0, 0);
  PLAYER.mesh.rotation.set(0, FACE_ANGLE[PLAYER.faceDir], 0);
  cameraReset();
  DEATH.eagle.visible = false;
  fxReset();
  syncWindow();
  UI.show(mode === 'title' ? 'title' : 'none');
  UI.refresh();
}

// Play Again. Rebuilds the world from the current seed and starts playing at once.
function gameRestart() {
  worldReset(G.runSeed, 'playing');
}

// Finish a death: record the best score, persist the coins, and show the game-over screen.
function finishRun() {
  G.newTop = G.score > G.topScore;
  if (G.newTop) {
    G.topScore = G.score;
    storeSet(CONFIG.keyTop, G.topScore);
    AUDIO.play('fanfare');
  }
  storeSet(CONFIG.keyCoins, G.coins);
  UI.fillOver();
  UI.show('over');
  UI.refresh();
}

/* -----------------------------------------------------------------
   Render. Visual state only, derived from sim state and sim time.
   ----------------------------------------------------------------- */
function renderFrame() {
  const t = G.simTime;
  for (const lane of LANES.values()) lane.visual(t);
  if ((G.mode === 'dying' || G.mode === 'gameover') && G.deathType !== null) {
    deathVisual(t);
  } else {
    playerVisual(t);
    DEATH.eagle.visible = false;
  }
  fxUpdate(t);
  cameraApply();
  dirLight.position.set(CAM.x + 3, 10, CAM.z - 4);
  lightTarget.position.set(CAM.x, 0, CAM.z);
  renderer.render(scene, CAM.camera);
  UI.refresh();
}

// Frame loop: fixed-step sim from real elapsed time, then one render.
let lastFrameMs = 0;
function frame(now) {
  if (lastFrameMs === 0) lastFrameMs = now;
  let dt = (now - lastFrameMs) / 1000;
  lastFrameMs = now;
  if (dt > CONFIG.maxFrameDt) dt = CONFIG.maxFrameDt;
  if (dt < 0) dt = 0;
  advance(dt);
  renderFrame();
  requestAnimationFrame(frame);
}

/* -----------------------------------------------------------------
   Test surface. window.HopLaneTest is used by the QA harness. Every
   method goes through the same code paths as real play.
   ----------------------------------------------------------------- */

// Describe one generated row for the test surface.
function describeRow(d) {
  const lanes = [];
  if (d.type === 'road') {
    const L = d.lane;
    lanes.push({
      dir: L.dir,
      speed: L.speed,
      length: WRAP_PERIOD,
      gapsMin: L.gapsMin,
      vehicles: L.vehicles.map((v) => ({ x0: v.a0, len: v.len, kind: v.model })),
    });
  } else if (d.type === 'rail') {
    const L = d.lane;
    lanes.push({
      dir: L.dir,
      speed: L.speed,
      length: WRAP_PERIOD,
      gapsMin: CONFIG.trainGapMin,
      trains: L.trains.map((tr) => ({ t: tr.t, len: tr.len, speed: tr.speed, clearAt: tr.clearAt })),
    });
  } else if (d.type === 'river') {
    const L = d.lane;
    if (L.kind === 'logs') {
      lanes.push({
        kind: 'logs',
        dir: L.dir,
        speed: L.speed,
        segments: L.logs.map((g) => ({ x0: g.off, len: g.len })),
      });
    } else {
      lanes.push({
        kind: 'pads',
        dir: 0,
        speed: 0,
        segments: L.pads.map((c) => ({ x0: c, len: 1 })),
      });
    }
  }
  return { index: d.index, type: d.type, obstacles: d.obstacles.slice(), lanes };
}

// Count every node below the scene root, recursively.
function countNodes() {
  let n = 0;
  scene.traverse((o) => {
    if (o !== scene) n++;
  });
  return n;
}

function stats() {
  const info = renderer.info;
  return {
    sceneChildren: countNodes(),
    geometries: info.memory.geometries,
    textures: info.memory.textures,
    drawCalls: info.render.calls,
    liveRows: LANES.size,
    poolSizes: poolSizes(),
  };
}

function testState() {
  return {
    mode: G.mode,
    simTime: G.simTime,
    score: G.score,
    topScore: G.topScore,
    coins: G.coins,
    row: PLAYER.row,
    x: PLAYER.x,
    hopping: PLAYER.hop.on,
    queued: PLAYER.queued,
    deathType: (G.mode === 'dying' || G.mode === 'gameover') ? G.deathType : null,
    idleTime: G.idleTime,
    muted: G.muted,
  };
}

function installTestApi() {
  window.HopLaneTest = {
    CONFIG,
    seed(n) {
      worldReset(n >>> 0 || 1, 'title');
    },
    start() {
      startRun();
    },
    input(dir) {
      handleDirection(dir);
    },
    step(ms) {
      advance(ms / 1000);
      return testState();
    },
    state() {
      return testState();
    },
    rows(from, to) {
      const out = [];
      for (let r = Math.max(0, from); r <= to; r++) out.push(describeRow(rowDesc(r)));
      return out;
    },
    lethalAt(row, x, t) {
      if (row < 0 || x < CONFIG.colMin || x > CONFIG.colMax) return false;
      const d = rowDesc(row);
      if (d.type === 'grass' || d.type === 'start') return false;
      return queryLane(d).lethalAt(x, t);
    },
    supportAt(row, x, t) {
      if (row < 0) return false;
      const d = rowDesc(row);
      if (d.type !== 'river') return false;
      return queryLane(d).supportAt(x, t);
    },
    isBlocked(row, x) {
      return isBlocked(row, x);
    },
    stats() {
      return stats();
    },
    restart() {
      gameRestart();
    },
  };
}

/* -----------------------------------------------------------------
   Startup. Builds models and scene, wires input, and starts the loop.
   ----------------------------------------------------------------- */
function boot() {
  UI.init();
  loadPersisted();
  AUDIO.muted = G.muted;
  G.runSeed = ((Date.now() ^ 0x5bd1e995) >>> 0) || 1;
  buildModels();
  initScene();
  wireInput();
  window.addEventListener('resize', resizeAll);
  resizeAll();
  worldReset(G.runSeed, 'title');
  UI.setMutedLabel();
  installTestApi();
  requestAnimationFrame(frame);
}

/* =================================================================
   STARTUP
   Everything above is definitions. Boot runs once, at the end, after
   the DOM is parsed and the module has finished evaluating.
   ================================================================= */
boot();
</script>
</body>
</html>
